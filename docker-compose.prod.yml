services:
  init-data:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /app/data /app/uploads && chown -R 10001:10001 /app"]
    volumes:
      - itsm_data:/app/data
      - itsm_uploads:/app/uploads
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    image: ${GATEWAY_IMAGE:-nexus-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:80:8080"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      nexus-itsm:
        condition: service_healthy
      nexus-identity:
        condition: service_healthy

  nexus-itsm:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-nexus-itsm}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - itsm_data:/app/data
      - itsm_uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      init-data:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  nexus-identity:
    build:
      context: .
      dockerfile: identity_service/Dockerfile
    image: ${IDENTITY_IMAGE:-nexus-identity}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - itsm_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      init-data:
        condition: service_completed_successfully

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    env_file: .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo-atr}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.19
    restart: unless-stopped
    command: agent -dev -client 0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  itsm_data:
  itsm_uploads:
  mongo_data:
  consul_data:
