# ==============================================================================
# Nexus ITSM Core — Kubernetes Overlay for Existing Application Cluster
# ==============================================================================
# Deploys nexus-itsm-core into an existing Kubernetes namespace alongside:
# - identity-management
# - identity-management-client
# - atr-gateway
# - atr-mongo
# - consul
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-itsm-core
  labels:
    app.kubernetes.io/name: nexus-itsm-core
    app.kubernetes.io/part-of: existing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-itsm-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-itsm-core
    spec:
      containers:
        - name: itsm-core
          image: nexus-itsm-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            # Consul address to retrieve spring mongo keys and admin password
            - name: CONSUL_HTTP_ADDR
              value: "http://consul:8500"
            - name: CONSUL_HTTP_TOKEN
              value: ""
            # MongoDB database name (credentials resolved dynamically from Consul)
            - name: MONGO_DATABASE
              value: "nexus_itsm"
            # Existing Identity Management microservice endpoint
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-management:8001"
            # Subpath hosting prefix
            - name: ITSM_SUBPATH
              value: "/itsm"
            - name: ITSM_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KM_API_TOKEN
              value: "enterprise_k8s_token"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-itsm-core
  labels:
    app.kubernetes.io/name: nexus-itsm-core
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nexus-itsm-core
